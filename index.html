<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      From src/, not public/, so the build names it by its content: a browser
      keeps a favicon by its URL and never fetches a new one at the same URL,
      which left the old logo in every tab after the new one shipped.
    -->
    <link rel="icon" type="image/svg+xml" href="./src/shell/ahpio.svg" />
    <link rel="manifest" href="./manifest.json" />
    <title>ahpio</title>
    <style>
      :root {
        color-scheme: light dark;
        --boot-bg: #ffffff;
        --boot-muted: #6b7280;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --boot-bg: #020617;
          --boot-muted: #94a3b8;
        }
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--boot-bg);
      }

      /*
       * The boot loader. It sits inside #root, so React's first render clears it.
       * It shows after a quarter second, so a warm boot never flashes it.
       */
      .boot-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-bg);
        opacity: 0;
        animation: boot-in 0.35s 0.25s ease-out forwards;
      }

      .boot-mark {
        display: block;
        overflow: visible;
      }

      /* The dots rest dim and light in turn, a quarter of a cycle apart; the same motion as src/shell/ahpio-mark.css. */
      .boot-dot {
        transform-box: fill-box;
        transform-origin: center;
        animation: boot-pulse 1.2s ease-in-out infinite;
      }

      .boot-dot:nth-of-type(2) {
        animation-delay: 0.3s;
      }

      .boot-dot:nth-of-type(3) {
        animation-delay: 0.6s;
      }

      .boot-dot:nth-of-type(4) {
        animation-delay: 0.9s;
      }

      @keyframes boot-pulse {
        0%, 50%, 100% { transform: scale(1); opacity: 0.35; }
        15% { transform: scale(1.18); opacity: 1; }
      }

      @keyframes boot-in {
        to { opacity: 1; }
      }

      .boot-noscript {
        font: 14px/1.5 system-ui, sans-serif;
        color: var(--boot-muted);
        text-align: center;
        padding: 40px 20px;
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-loading {
          opacity: 1;
          animation: none;
        }

        .boot-dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loading" role="status" aria-label="Loading ahpio">
        <svg class="boot-mark" width="72" height="72" viewBox="0 0 64 64" aria-hidden="true">
          <circle class="boot-dot" cx="31.64" cy="9.32" r="7.92" fill="#00A859" />
          <circle class="boot-dot" cx="31.64" cy="36.68" r="7.92" fill="#5B9BFF" />
          <circle class="boot-dot" cx="8.6" cy="54.68" r="7.92" fill="#FFC82A" />
          <circle class="boot-dot" cx="55.4" cy="54.68" r="7.92" fill="#ED3237" />
        </svg>
      </div>
      <noscript>
        <p class="boot-noscript">ahpio needs JavaScript to run.</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
